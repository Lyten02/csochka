<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#9cc3e0" />
    <title>CS 1.6 — просмотр карты</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <canvas id="view" tabindex="0" aria-label="Карта"></canvas>

    <div id="loading" role="status">
      <div class="load-box">
        <div class="load-title">Загрузка карты…</div>
        <div class="load-bar"><div id="load-fill"></div></div>
        <div id="load-text">Подключение…</div>
      </div>
    </div>
    <div id="error" hidden></div>

    <div id="toolbar">
      <select id="spawn-select" title="Точка появления (1–9)" aria-label="Точка появления"></select>
      <button id="btn-spawn" type="button" title="Вернуться на спавн (R)">Спавн (R)</button>
      <button id="btn-lightmap" type="button" class="on" title="Карта освещения">Освещение</button>
      <button id="btn-wire" type="button" title="Каркас">Каркас</button>
      <button id="btn-overlay" type="button" class="on" title="Панель отладки (F3)">Отладка (F3)</button>
    </div>

    <aside id="overlay"></aside>

    <div id="hint">
      Клик — управление мышью, WASD — полёт, Пробел/E — вверх, C/Q/Ctrl — вниз,
      Shift ×4, Alt ×0.25, колесо — скорость, Esc — отпустить мышь.
      <span id="speed-hint"></span>
    </div>

    <div id="touch-ui">
      <div id="joystick"><div id="joy-knob"></div></div>
      <div id="vert-buttons">
        <button id="btn-up" type="button" aria-label="Вверх">▲</button>
        <button id="btn-down" type="button" aria-label="Вниз">▼</button>
      </div>
    </div>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
